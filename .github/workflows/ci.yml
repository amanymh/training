name: Ci-pipeline
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
jobs:
  printAmany:
    runs-on: ubuntu-latest
    steps:
      - name: echo Hello Amany
        run: echo "Hello Amany"

  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: yarn install
      - name: Build the application
        run: yarn build 
      - name: Run tests
        run: yarn test   
