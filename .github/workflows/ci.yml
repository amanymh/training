name: Ci-pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install

  build:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Build the application
        run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Run tests
        run: npm test